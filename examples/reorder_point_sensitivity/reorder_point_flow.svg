<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Reorder point sensitivity workflow</title>
<desc id="desc">Synthetic inventory inputs feed a base reorder point and low and high sensitivity scenarios. A human reviews the result before any purchasing action.</desc>
<rect width="1200" height="430" fill="#f7fafc"/>
<text x="60" y="55" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#102a43">REORDER-POINT SENSITIVITY</text>
<text x="60" y="88" font-family="Arial,sans-serif" font-size="17" fill="#486581">A transparent threshold check — not an automatic purchase order</text>
<g font-family="Arial,sans-serif">
  <rect x="55" y="145" width="250" height="160" rx="18" fill="#e8f1f3" stroke="#315c69" stroke-width="2"/>
  <text x="80" y="183" font-size="19" font-weight="700" fill="#102a43">1 · INPUTS</text>
  <text x="80" y="220" font-size="16" fill="#243b53">Daily demand</text>
  <text x="80" y="246" font-size="16" fill="#243b53">Lead time + safety stock</text>
  <text x="80" y="272" font-size="16" fill="#243b53">Current stock + unit cost</text>
  <path d="M305 225 H365" stroke="#315c69" stroke-width="4" fill="none"/>
  <path d="M353 213 L367 225 L353 237" stroke="#315c69" stroke-width="4" fill="none"/>
  <rect x="370" y="145" width="260" height="160" rx="18" fill="#eef0f7" stroke="#52658c" stroke-width="2"/>
  <text x="395" y="183" font-size="19" font-weight="700" fill="#102a43">2 · CALCULATE</text>
  <text x="395" y="222" font-size="17" fill="#243b53">Base threshold</text>
  <text x="395" y="250" font-size="17" fill="#243b53">Low / high scenarios</text>
  <text x="395" y="278" font-size="15" fill="#52658c">Explicit assumptions</text>
  <path d="M630 225 H690" stroke="#52658c" stroke-width="4" fill="none"/>
  <path d="M678 213 L692 225 L678 237" stroke="#52658c" stroke-width="4" fill="none"/>
  <rect x="695" y="145" width="220" height="160" rx="18" fill="#f4efe7" stroke="#9a6a32" stroke-width="2"/>
  <text x="720" y="183" font-size="19" font-weight="700" fill="#102a43">3 · FLAG</text>
  <text x="720" y="224" font-size="17" fill="#243b53">Threshold gap</text>
  <text x="720" y="252" font-size="17" fill="#243b53">Days of cover</text>
  <text x="720" y="280" font-size="15" fill="#7b4d1d">Review required</text>
  <path d="M915 225 H975" stroke="#3b6b63" stroke-width="4" fill="none"/>
  <path d="M963 213 L977 225 L963 237" stroke="#3b6b63" stroke-width="4" fill="none"/>
  <rect x="980" y="145" width="165" height="160" rx="18" fill="#e6f3ee" stroke="#3b6b63" stroke-width="2"/>
  <text x="1000" y="183" font-size="19" font-weight="700" fill="#102a43">4 · HUMAN</text>
  <text x="1000" y="222" font-size="16" fill="#243b53">Check open POs</text>
  <text x="1000" y="248" font-size="16" fill="#243b53">Check constraints</text>
  <text x="1000" y="274" font-size="16" fill="#243b53">Decide manually</text>
</g>
<text x="60" y="365" font-family="Arial,sans-serif" font-size="16" fill="#486581">Illustrative data only. The tool never connects to inventory systems or creates orders.</text>
</svg>
